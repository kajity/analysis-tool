[project]
name = "ates"
version = "0.1.0"
description = "Reproducible Python analysis workflows for experimental data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "omegaconf>=2.3.0",
    "scipy>=1.17.1",
]

[project.scripts]
"ates.iv" = "scripts.iv.main:main"
"ates.thickness" = "scripts.thickness.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.setuptools.package-data]
"scripts.iv" = ["config/*.yaml"]

[tool.black]
target-version = ["py312"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
